<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Электролаба</title>
<meta name="description" content="Тренажёр электромонтажа: собирай схемы, тяни провода, подавай питание">
<meta name="theme-color" content="#151A21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Электролаба">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #F3F0E8; --panel: #FFFFFF; --ink: #1B2430; --muted: #6A7380; --line: #DCD6C8;
  --grid: rgba(38, 74, 128, .08); --grid2: rgba(38, 74, 128, .17);
  --acc: #E8731A; --acc-soft: rgba(232, 115, 26, .14); --acc-ink: #FFFFFF;
  --dev: #FFFFFF; --dev-line: #2A3340; --dev-soft: #E8EBEF; --contact: #39424F;
  --box: rgba(255, 255, 255, .55);
  --hot: #E0362C; --lit: #FFC93C; --live: #1E9A52;
  --w-brown: #8A4B22; --w-black: #1C1C1C; --w-white: #FAFAF5; --w-grey: #8B9097;
  --w-red: #D2302A; --w-blue: #2F7BD9; --w-yellow: #E9C31B; --w-green: #2E9E48;
  --casing: rgba(20, 28, 38, .55); --k-l2: #1C1C1C;
  --shadow: 0 8px 28px rgba(20, 28, 38, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141920; --panel: #1D242D; --ink: #E5EAF0; --muted: #8E98A6; --line: #2D3643;
    --grid: rgba(140, 172, 214, .06); --grid2: rgba(140, 172, 214, .13);
    --acc-soft: rgba(232, 115, 26, .2);
    --dev: #232B35; --dev-line: #B4BECB; --dev-soft: #2C3541; --contact: #CBD3DE;
    --box: rgba(35, 43, 53, .55);
    --w-brown: #B06A3B; --w-black: #0A0A0A; --w-grey: #9AA0A8;
    --casing: rgba(235, 240, 246, .42); --k-l2: #5B616B;
    --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141920; --panel: #1D242D; --ink: #E5EAF0; --muted: #8E98A6; --line: #2D3643;
  --grid: rgba(140, 172, 214, .06); --grid2: rgba(140, 172, 214, .13);
  --acc-soft: rgba(232, 115, 26, .2);
  --dev: #232B35; --dev-line: #B4BECB; --dev-soft: #2C3541; --contact: #CBD3DE;
  --box: rgba(35, 43, 53, .55);
  --w-brown: #B06A3B; --w-black: #0A0A0A; --w-grey: #9AA0A8;
  --casing: rgba(235, 240, 246, .42); --k-l2: #5B616B;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }

section { position: fixed; inset: 0; display: flex; flex-direction: column; }
.top {
  display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; min-height: 52px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
}
.brand { font-weight: 700; font-size: 18px; flex: 1; letter-spacing: .2px; }
.brand b { color: var(--acc); }
.ib { border: 0; background: transparent; min-width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
.ib:hover { background: var(--dev-soft); }
.ib:disabled { opacity: .3; cursor: default; background: transparent; }
.title { flex: 1; min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; padding: 6px 4px; }

/* список */
#list { flex: 1; overflow: auto; padding: 16px 16px 110px; display: flex; flex-direction: column; gap: 10px; max-width: 720px; width: 100%; margin: 0 auto; }
.card { display: flex; align-items: center; gap: 8px; padding: 14px 8px 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.card:hover { border-color: var(--acc); }
.c-main { flex: 1; min-width: 0; }
.c-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.c-more { border: 0; background: transparent; font-size: 22px; width: 40px; height: 40px; border-radius: 10px; color: var(--muted); }
.empty { text-align: center; padding: 48px 20px; max-width: 420px; margin: 0 auto; }
.empty-ic { font-size: 44px; color: var(--acc); }
.fab {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 20px);
  border: 0; background: var(--acc); color: var(--acc-ink); font-weight: 650; padding: 14px 26px; border-radius: 999px; box-shadow: var(--shadow);
}

/* редактор */
#cv-wrap {
  position: relative; flex: 1; overflow: hidden; touch-action: none;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
#hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px;
  padding: 6px 12px; border-radius: 999px; pointer-events: none; text-align: center; box-shadow: var(--shadow);
}
#hint.live { color: #fff; background: var(--hot); border-color: var(--hot); font-weight: 600; }
.power { border: 1px solid var(--line); background: var(--dev-soft); border-radius: 10px; height: 38px; padding: 0 12px; font-weight: 700; font-size: 13px; letter-spacing: .3px; }
.power.on { background: var(--hot); border-color: var(--hot); color: #fff; }
.tools {
  display: flex; gap: 8px; align-items: center; flex: none;
  padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px); background: var(--panel); border-top: 1px solid var(--line);
}
.tools .grow { flex: 1; }
.tb { border: 1px solid var(--line); background: var(--dev-soft); height: 44px; min-width: 44px; border-radius: 12px; font-size: 18px; }
.tb.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 650; font-size: 15px; padding: 0 18px; }

.tb.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tb.chk { font-weight: 700; font-size: 15px; padding: 0 12px; }
.tb.chk.err { background: var(--hot); border-color: var(--hot); color: #fff; }
.tb.chk.warn { background: var(--acc-soft); border-color: var(--acc); color: var(--acc); }
@media (max-width: 520px) { .tb.zoom { display: none; } }

/* мультиметр */
#meter {
  position: absolute; top: 10px; left: 10px; min-width: 170px; max-width: calc(100% - 20px);
  background: #23272E; color: #DDE3EA; border-radius: 14px; padding: 8px 12px 10px; box-shadow: var(--shadow);
  pointer-events: none; border: 3px solid #E8B71A;
}
.m-lcd { background: #B9C6A8; color: #1E2617; border-radius: 6px; padding: 4px 10px; font: 700 26px/1.1 ui-monospace, Consolas, monospace; text-align: right; }
.m-sub { font-size: 12px; margin-top: 6px; color: #AEB7C2; }
.probe circle { stroke: #fff; stroke-width: 1.5; }
.probe text { font-size: 8px; font-weight: 700; fill: #fff; }
.probe.red circle { fill: #D2302A; } .probe.black circle { fill: #1C1C1C; }

/* ошибки */
.mark circle { stroke: #fff; stroke-width: 1.5; }
.mark text { fill: #fff; font-weight: 800; }
.mark.m-err circle { fill: var(--hot); } .mark.m-warn circle { fill: var(--acc); }
.iss { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px; }
.iss:hover { border-color: var(--acc); }
.iss-dot { flex: none; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 13px; margin-top: 1px; }
.iss.err .iss-dot { background: var(--hot); } .iss.warn .iss-dot { background: var(--acc); }
.iss-t { flex: 1; font-size: 14px; }
.iss-p { display: inline-block; font-size: 11px; font-weight: 650; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-top: 4px; }
.iss-list { display: flex; flex-direction: column; gap: 8px; }

/* панель свойств */
#panel, #issues {
  position: absolute; left: 8px; right: 8px; bottom: 8px; max-width: 560px; margin: 0 auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; max-height: 50%; overflow: auto;
}
@media (min-width: 900px) { #panel, #issues { left: auto; right: 12px; top: 12px; bottom: auto; width: 360px; max-height: calc(100% - 24px); } }
.p-head { display: flex; align-items: center; gap: 2px; margin: -4px -6px -2px 0; }
.p-head b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-head .ib { font-size: 18px; color: var(--muted); }
.ib.danger { color: var(--hot); }
.p-lbl { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--dev-soft); border-radius: 9px; min-width: 38px; height: 34px; padding: 0 10px; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 650; }
.sep { width: 8px; }
.unit { font-size: 13px; margin-left: 2px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.on { outline: 3px solid var(--acc); outline-offset: 2px; }
.sw-brown { background: var(--w-brown); } .sw-black { background: var(--w-black); } .sw-white { background: var(--w-white); }
.sw-grey { background: var(--w-grey); } .sw-red { background: var(--w-red); } .sw-blue { background: var(--w-blue); }
.sw-pe { background: repeating-linear-gradient(45deg, var(--w-yellow) 0 6px, var(--w-green) 6px 12px); }
.btn { border: 1px solid var(--line); background: var(--dev-soft); border-radius: 10px; height: 40px; padding: 0 14px; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 650; }
.btn.danger { color: var(--hot); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; }
textarea.inp { resize: vertical; margin-top: 8px; font-size: 13px; }

/* окна */
#modal { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  background: var(--panel); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto;
  border-radius: 18px 18px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); box-shadow: var(--shadow);
}
@media (min-width: 700px) { #modal { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0 0 10px; font-size: 18px; }
.row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.act-list { display: flex; flex-direction: column; gap: 8px; }
.act { text-align: left; height: 48px; }
.pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pal-it { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; text-align: center; }
.pal-it:hover { border-color: var(--acc); }
.mini { width: 72px; height: 56px; }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 140px); transform: translate(-50%, -12px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px);
  opacity: 0; pointer-events: none; transition: .2s; z-index: 30; text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- рисунок схемы ---- */
svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); text-anchor: middle; }
.body { fill: var(--dev); stroke: var(--dev-line); stroke-width: 1.6; }
.t-m { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
.t-s { font-size: 11px; font-weight: 650; font-family: ui-monospace, Consolas, monospace; }
.t-xs { font-size: 9px; font-weight: 650; }
.t-l { font-size: 16px; font-weight: 650; }
.t-term { font-size: 9px; font-weight: 650; fill: var(--muted); }
.dlbl { font-size: 12px; font-weight: 600; fill: var(--muted); }
.bolt { fill: var(--acc); }
.slot { fill: var(--dev-soft); stroke: var(--dev-line); stroke-width: 1; }
.lever { fill: var(--dev-line); }
.lever.on { fill: var(--acc); }
.st { fill: var(--muted); }
.st.on { fill: var(--acc); }
.mod { stroke: var(--dev-line); stroke-width: 1; opacity: .5; }
.body.run { stroke: var(--live); stroke-width: 2.4; }
.ico { fill: none; stroke: var(--dev-line); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.ico.on { stroke: var(--live); }
.ico text { stroke: none; }
.disp { fill: #12301F; stroke: none; }
.disp-t { fill: #4BE38A; font-family: ui-monospace, Consolas, monospace; }
.disp-t.big { font-size: 15px; font-weight: 700; }
.tbtn { fill: var(--dev-soft); stroke: var(--dev-line); stroke-width: 1; }
.lid { fill: none; stroke: var(--dev-line); stroke-width: 2.4; }
.ipt { fill: var(--muted); }
.node { fill: #C98B4F; stroke: var(--casing); stroke-width: 1.5; }
.node.hot { fill: var(--hot); }
.row-in { display: flex; align-items: center; gap: 10px; }
.row-in .inp { width: 120px; }
.p-note { font-size: 13px; color: var(--muted); }
.tip { fill: #C98B4F; stroke: var(--dev-line); stroke-width: 1.2; }
.tip.hot { fill: var(--hot); }
.badge rect { stroke-width: 1; }
.badge text { font-size: 10.5px; font-weight: 650; }
.b-ok rect { fill: var(--lit); stroke: #C98A00; } .b-ok text { fill: #3A2A00; }
.b-off rect { fill: var(--dev-soft); stroke: var(--line); } .b-off text { fill: var(--muted); }
.b-warn rect { fill: var(--dev-soft); stroke: var(--acc); } .b-warn text { fill: var(--acc); }
.b-bad rect { fill: var(--hot); stroke: var(--hot); } .b-bad text { fill: #fff; }
.trip { fill: var(--hot); }
.key { fill: transparent; stroke: var(--dev-line); stroke-width: 1; stroke-opacity: .35; }
.key.on { fill: var(--acc-soft); stroke: var(--acc); stroke-opacity: .7; }
.ct { stroke: var(--contact); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.ct.hot { stroke: var(--hot); }
.pv { fill: var(--contact); }
.cp { fill: var(--dev); stroke: var(--contact); stroke-width: 1.5; }
.bulb { fill: var(--dev); stroke: var(--dev-line); stroke-width: 1.6; }
.bulb.lit { fill: var(--lit); stroke: #C98A00; }
.glow { fill: var(--lit); opacity: .3; }
.bx { stroke: var(--dev-line); stroke-width: 1.4; }
.strip { fill: var(--dev-soft); stroke: var(--dev-line); stroke-width: 1.2; }
.face { fill: var(--dev); stroke: var(--dev-line); stroke-width: 1.6; }
.face.live { stroke: var(--live); stroke-width: 3; }
.live-t { fill: var(--live); }
.hole { fill: var(--dev-line); }
.earth { fill: var(--w-grey); }
.wbody { fill: var(--dev); stroke: var(--dev-line); stroke-width: 1.4; fill-opacity: .85; }
.wlever { fill: var(--acc); }
.plate { stroke: var(--w-grey); stroke-width: 3; stroke-linecap: round; }
.bus { stroke: var(--dev-line); stroke-width: 1.2; }
.bus-t { fill: #fff; text-anchor: start; }
.screw { fill: #D9DDE2; stroke: #6A717B; stroke-width: 1; }
.shield { fill: var(--box); stroke: var(--dev-line); stroke-width: 2.4; }
.shield-in { fill: none; stroke: var(--dev-line); stroke-width: 1; opacity: .35; }
.rail { fill: var(--dev-soft); stroke: var(--w-grey); stroke-width: 1; }
.led { fill: var(--dev-soft); stroke: var(--dev-line); stroke-width: .8; }
.led.on { fill: #3BD16F; }
.lcd { fill: #B9C6A8; stroke: var(--dev-line); stroke-width: .8; }
.lcd-t { font: 700 14px ui-monospace, Consolas, monospace; fill: #1E2617; }
.kbtn { fill: var(--dev-soft); stroke: var(--dev-line); stroke-width: .8; }
.beam { fill: var(--lit); opacity: .28; }
.comb { fill: #C98B4F; stroke: #8A5A2B; stroke-width: 1; }
.comb-t { fill: #3A2410; }
.tooth { stroke: #C98B4F; stroke-width: 4; stroke-linecap: round; }
.tooth.hot { stroke: var(--hot); }
.tooth.cut { stroke: var(--w-grey); stroke-width: 3; }
.teeth .chip { min-width: 34px; padding: 0 6px; font-size: 12px; }
.chip.cut { text-decoration: line-through; color: var(--muted); background: transparent; border-style: dashed; }
.cord-case { fill: none; stroke: var(--casing); stroke-width: 5.5; stroke-linecap: round; }
.cord { fill: none; stroke: #3A3F47; stroke-width: 3.5; stroke-linecap: round; }
.cord.on { stroke: #3A3F47; }
.plug { fill: #F2F2EE; stroke: #3A3F47; stroke-width: 1.6; }
.plug-g { fill: #3A3F47; }
.chip-in { width: 72px; height: 34px; padding: 4px 8px; font-size: 14px; }
.jbox { fill: var(--box); stroke: var(--dev-line); stroke-width: 2; }
.jbox-in { fill: none; stroke: var(--dev-line); stroke-width: 1; stroke-dasharray: 3 5; opacity: .5; }
.jl { fill: var(--muted); }

.lead { stroke: var(--dev-line); stroke-width: 1.6; }
.term { fill: var(--dev); stroke-width: 2.2; }
.term.k-L, .term.k-L1 { stroke: var(--dev-line); } .term.k-L2 { stroke: var(--k-l2); } .term.k-L3 { stroke: var(--w-grey); } .term.k-N { stroke: var(--w-blue); } .term.k-PE { stroke: var(--w-green); } .term.k-x { stroke: var(--dev-line); }
.term.hot { fill: var(--hot); }
.pend-ring { fill: var(--acc-soft); stroke: var(--acc); stroke-width: 2; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-opacity: .3; fill-opacity: .4; } }

.w-case { stroke: var(--casing); stroke-width: 5.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.w-core { stroke-width: 3.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.w-stripe { stroke-dasharray: 7 7; stroke-linecap: butt; }
.w-hot { stroke: var(--hot); stroke-width: 12; fill: none; opacity: .3; stroke-linejoin: round; stroke-linecap: round; animation: hot 1.4s ease-in-out infinite; }
@keyframes hot { 50% { opacity: .14; } }
.w-sel { stroke: var(--acc); stroke-width: 14; fill: none; opacity: .35; stroke-linejoin: round; stroke-linecap: round; }
.sel-box { fill: none; stroke: var(--acc); stroke-width: 1.6; stroke-dasharray: 6 4; }
.h-mid { fill: var(--panel); stroke: var(--acc); }
.h-bend { fill: var(--acc); stroke: var(--panel); }
.rubber { stroke: var(--acc); stroke-width: 3; stroke-dasharray: 6 5; stroke-linecap: round; }
@media (prefers-reduced-motion: reduce) { .pend-ring, .w-hot { animation: none; } }
</style>
</head>
<body>

<section id="scr-list">
  <header class="top">
    <div class="brand">⚡ Электро<b>лаба</b></div>
    <button class="ib" id="btn-settings" aria-label="Настройки">⚙</button>
  </header>
  <main id="list"></main>
  <button class="fab" id="btn-new">＋ Новая схема</button>
</section>

<section id="scr-ed" hidden>
  <header class="top">
    <button class="ib" id="btn-back" aria-label="К списку схем">‹</button>
    <div class="title" id="ed-name" title="Переименовать"></div>
    <button class="ib" id="btn-undo" aria-label="Отменить">↶</button>
    <button class="ib" id="btn-redo" aria-label="Вернуть">↷</button>
    <button class="power" id="btn-power">⚡ ВЫКЛ</button>
  </header>
  <div id="cv-wrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="pe-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="10" height="10" style="fill:var(--w-yellow)"/><rect width="5" height="10" style="fill:var(--w-green)"/>
        </pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="hint" hidden></div>
    <div id="meter" hidden></div>
    <div id="panel" hidden></div>
    <div id="issues" hidden></div>
  </div>
  <nav class="tools">
    <button class="tb primary" id="btn-add">＋ Устройство</button>
    <button class="tb chk" id="btn-check" title="Проверка по ПУЭ">✓</button>
    <button class="tb" id="btn-meter" title="Мультиметр" aria-label="Мультиметр">
      <svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="1" width="16" height="20" rx="3"/><rect x="5" y="4" width="10" height="6" rx="1"/><circle cx="10" cy="15" r="3"/></svg>
    </button>
    <span class="grow"></span>
    <button class="tb zoom" id="btn-zout" aria-label="Уменьшить">−</button>
    <button class="tb zoom" id="btn-zin" aria-label="Увеличить">＋</button>
    <button class="tb" id="btn-fit" aria-label="Вся схема">⤢</button>
  </nav>
</section>

<div id="modal" hidden></div>
<div id="toast" role="status"></div>

<script src="parts.js"></script>
<script src="engine.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
